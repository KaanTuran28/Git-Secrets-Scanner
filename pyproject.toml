[project]
name = "git-secrets-scanner"
version = "0.1.0"
description = "Scan a codebase for leaked API keys, tokens, and credentials."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "T-X" }]
dependencies = []

[project.scripts]
git-secrets-scanner = "git_secrets_scanner:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["git_secrets_scanner"]

[tool.ruff]
line-length = 100
target-version = "py39"
